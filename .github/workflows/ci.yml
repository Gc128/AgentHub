name: trusted-change-set-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify migrations on a new SQLite database
        env:
          DATABASE_URL: sqlite:////tmp/agenthub-ci.db
        run: alembic upgrade head

      - name: Python tests and static checks
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy agenthub

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
